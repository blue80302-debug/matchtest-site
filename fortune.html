var curLang='en';

function dayHash(bday){
  var d=new Date();var ds=d.getFullYear()+''+d.getMonth()+''+d.getDate();
  var s=bday+ds;var h=0;
  for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}
  return Math.abs(h);
}

function checkFortune(){
  var bday=document.getElementById('inpBday').value;
  if(!bday)return;

  var cacheKey='fortune_'+bday+'_'+new Date().toDateString();
  var cached=localStorage.getItem(cacheKey);
  if(cached){
    renderResult(JSON.parse(cached));
    return;
  }

  var h=dayHash(bday);
  var cats=L[curLang].catKeys;
  var scores=[];var msgs=[];
  for(var i=0;i<cats.length;i++){
    var sc=40+((h>>(i*5))%61);
    scores.push(sc);
    var good=sc>=55?0:1;
    var mi=((h>>(i*3+2))%5);
    msgs.push({cat:L[curLang].cats[i],score:sc,msg:(L[curLang].msgs[cats[i]][good][mi])});
  }

  var overall=Math.round(scores.reduce(function(a,b){return a+b},0)/scores.length);
  var colorIdx=h%COLORS[curLang].length;
  var luckyNum=(h%89)+1;
  var dirIdx=(h>>7)%DIRS[curLang].length;

  var data={overall:overall,items:msgs,color:COLORS[curLang][colorIdx],num:luckyNum,dir:DIRS[curLang][dirIdx]};

  try{localStorage.setItem(cacheKey,JSON.stringify(data))}catch(e){}
  renderResult(data);
}

function renderResult(data){
  document.getElementById('resScore').textContent=data.overall+'%';
  document.getElementById('resLabel').textContent=L[curLang].overall;

  var list=document.getElementById('fortuneList');
  list.innerHTML='';
  for(var i=0;i<data.items.length;i++){
    var it=data.items[i];
    var stars='';
    var filled=Math.round(it.score/20);
    for(var j=0;j<5;j++)stars+=j<filled?'★':'☆';
    list.innerHTML+='<div class="fortune-item"><div class="fi-header"><span class="fi-cat">'+it.cat+'</span><span class="fi-stars">'+stars+'</span></div><div class="fi-msg">'+it.msg+'</div></div>';
  }

  document.getElementById('luckyTitle').textContent=L[curLang].luckyTitle;
  document.getElementById('luckyItems').innerHTML=
    '<span class="lucky-tag">'+L[curLang].luckyColor+': '+data.color+'</span>'+
    '<span class="lucky-tag">'+L[curLang].luckyNum+': '+data.num+'</span>'+
    '<span class="lucky-tag">'+L[curLang].luckyDir+': '+data.dir+'</span>';

  document.getElementById('cachedNote').textContent=L[curLang].cachedNote;

  var el=document.getElementById('result');
  el.style.display='block';
  el.style.animation='none';el.offsetHeight;el.style.animation='popIn .5s cubic-bezier(.34,1.56,.64,1)';
}

function setLang(lang){
  curLang=lang;
  var t=L[lang];
  document.getElementById('t-title').textContent=t.title;
  document.getElementById('t-sub').textContent=t.sub;
  document.getElementById('lbl-bday').textContent=t.lblBday;
  document.getElementById('btnCheck').textContent=t.btn;
  document.getElementById('nav-home').textContent=t.nav.home;
  document.getElementById('nav-about').textContent=t.nav.about;
  document.getElementById('nav-contact').textContent=t.nav.contact;
  document.getElementById('nav-privacy').textContent=t.nav.privacy;
  document.getElementById('nav-terms').textContent=t.nav.terms;
  document.querySelectorAll('.tab-text').forEach(function(el){
    var k=el.getAttribute('data-key');
    if(t[k])el.textContent=t[k];
  });
  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.classList.toggle('active',b.getAttribute('data-lang')===lang);
  });
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
}
