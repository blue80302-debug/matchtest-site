document.querySelectorAll('.color-btn').forEach(function(b){
    b.addEventListener('click',function(){
        document.querySelectorAll('.color-btn').forEach(function(x){x.classList.remove('selected')});
        b.classList.add('selected');selectedColor=b.dataset.color;
    });
});

function setLang(lang){
    currentLang=lang;var t=i18n[lang];
    document.getElementById('t-title').textContent=t.title;
    document.getElementById('t-sub').textContent=t.sub;
    document.getElementById('t-prompt').textContent=t.prompt;
    document.getElementById('btnCalc').textContent=t.btn;
    document.getElementById('t-copyBtn').innerHTML=t.copyBtn;
    document.getElementById('t-retry').textContent=t.retry;
    document.getElementById('lblPersonality').textContent=t.lblPersonality;
    document.getElementById('lblRelationship').textContent=t.lblRelationship;
    document.getElementById('lblCareer').textContent=t.lblCareer;
    document.getElementById('lblAdvice').textContent=t.lblAdvice;
    document.getElementById('nav-home').textContent=t.navHome;
    document.getElementById('nav-about').textContent=t.navAbout;
    document.getElementById('nav-contact').textContent=t.navContact;
    document.getElementById('nav-privacy').textContent=t.navPrivacy;
    document.getElementById('nav-terms').textContent=t.navTerms;
    document.getElementById('f-about').textContent=t.navAbout;
    document.getElementById('f-contact').textContent=t.navContact;
    document.getElementById('f-privacy').textContent=t.navPrivacy;
    document.getElementById('f-terms').textContent=t.navTerms;
    document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active',b.dataset.lang===lang)});
    document.querySelectorAll('.tab-text').forEach(function(el){var k=el.dataset.key;if(t[k])el.textContent=t[k]});
    var cn=t.colors;
    document.getElementById('cn-red').textContent=cn.red;
    document.getElementById('cn-blue').textContent=cn.blue;
    document.getElementById('cn-green').textContent=cn.green;
    document.getElementById('cn-yellow').textContent=cn.yellow;
    document.getElementById('cn-purple').textContent=cn.purple;
    document.getElementById('cn-orange').textContent=cn.orange;
    document.getElementById('cn-black').textContent=cn.black;
    document.getElementById('cn-white').textContent=cn.white;
    if(t.articlePsych){
        document.getElementById('articlePsych').innerHTML='<h2>'+t.articlePsych.title+'</h2>'+t.articlePsych.body;
        document.getElementById('articleMeaning').innerHTML='<h2>'+t.articleMeaning.title+'</h2>'+t.articleMeaning.body;
        document.getElementById('articleTherapy').innerHTML='<h2>'+t.articleTherapy.title+'</h2>'+t.articleTherapy.body;
    }

(function detectLang(){
    var bl=(navigator.language||'ko').substring(0,2).toLowerCase();
    if(bl==='ko')setLang('ko');else setLang('en');
})();

function analyze(){
    var t=i18n[currentLang];
    if(!selectedColor){alert(t.alertSelect);return}
    var d=colorData[selectedColor];
    var r=d[currentLang];
    document.getElementById('resBadge').style.background=d.gradient;
    document.getElementById('resBadge').textContent=d.emoji;
    document.getElementById('resTitle').textContent=r.title;
    document.getElementById('resSubtitle').textContent=r.subtitle;
    document.getElementById('resKeyword').textContent=r.keyword;
    var tagsHtml='';r.traits.forEach(function(tr){tagsHtml+='<span class="trait-tag">'+tr+'</span>'});
    document.getElementById('resTags').innerHTML=tagsHtml;
    document.getElementById('resMsg').textContent=r.msg;
    document.getElementById('resPersonality').textContent=r.personality;
    document.getElementById('resRelationship').textContent=r.relationship;
    document.getElementById('resCareer').textContent=r.career;
    document.getElementById('resAdvice').textContent=r.advice;
    var res=document.getElementById('result');res.style.display='none';res.offsetHeight;res.style.display='block';
}

function resetTest(){
    selectedColor=null;
    document.querySelectorAll('.color-btn').forEach(function(b){b.classList.remove('selected')});
    document.getElementById('result').style.display='none';
}

function getShareText(){
    var cn=i18n[currentLang].colors[selectedColor]||selectedColor;
    if(currentLang==='ko')return'나의 색깔 심리: '+cn+' — '+colorData[selectedColor].ko.title+'! 색깔 심리 테스트 해보세요!';
    return'My Color Psychology: '+cn+' — '+colorData[selectedColor].en.title+'! Try the Color Psychology Test!';
}
function getShareUrl(){return window.location.href}
function shareTwitter(){window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(getShareText())+'&url='+encodeURIComponent(getShareUrl()),'_blank','width=550,height=420')}
function shareFacebook(){window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(getShareUrl())+'&quote='+encodeURIComponent(getShareText()),'_blank','width=550,height=420')}
function shareWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(getShareText()+' '+getShareUrl()),'_blank')}
function shareLine(){window.open('https://social-plugins.line.me/lineit/share?url='+encodeURIComponent(getShareUrl())+'&text='+encodeURIComponent(getShareText()),'_blank')}
function shareKakao(){copyLink()}
function copyLink(){
    var url=getShareUrl();
    if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){alert(i18n[currentLang].alertCopied)});
    }else{
        var ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.left='-9999px';
        document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
        alert(i18n[currentLang].alertCopied);
    }
}
