    sec1P1:"생일 궁합 테스트는 두 사람의 생년월일을 바탕으로 서양 별자리, 동양 띠(십이지), 수비학 세 가지 체계를 결합하여 궁합을 분석합니다. 각 사람의 생년월일에서 태양 별자리, 출생 연도 기반 띠 동물, 그리고 전체 날짜에서 도출한 생명수(Life Path Number)를 추출합니다. 이 세 가지 차원을 교차 비교하여 성격 조화와 에너지 균형을 모두 반영하는 궁합 점수를 산출합니다.",

    sec1Title:"什么是生日配对测试？",
    sec1P1:"生日配对测试通过结合三大经典体系来分析两人之间的关系：西方星座、中国生肖和数字命理学。每个人的出生日期揭示了他们的太阳星座、基于出生年份的生肖动物，以及由完整日期推导出的生命数字。通过交叉比对这三个维度，测试得出一个同时反映性格契合度和能量和谐度的配对分数。",
    sec1P2:"与简单的太阳星座匹配不同，这种多维方法能捕捉到单一体系测试遗漏的细微差别。西方星座反映情感和行为倾向，中国生肖揭示与年份周期相关的深层人生主题，而数字命理学则发掘出生日期的振动本质。三者结合，描绘出两人关系更丰富、更准确的全貌。",
    sec2Title:"它是如何运作的？",
    sec2P1:"算法为三个配对维度分配加权分数，然后将它们融合为一个百分比。星座配对占总分的40%，生肖配对占30%，数字命理配对占30%。结果被映射到从"宇宙级灵魂伴侣"到"宇宙谜题"的十个等级之一。",
    sec2Sub:"三大分析要素",
    sec2List:["星座配对 — 使用12×12元素亲和力矩阵比较两人的西方太阳星座。共享相同元素（火、土、风、水）或互补元素的星座得分更高。","生肖配对 — 计算12年周期内两个出生年份动物之间的循环距离。周期轮上距离更近的动物往往共享更和谐的能量。","数字命理（生命数字）— 将每个完整的出生日期简化为个位数（或大师数字11/22），并衡量两个生命数字的共振程度。"],
    sec3Title:"常见问题",
    faq1Q:"生日配对分数有科学依据吗？",faq1A:"没有。此测试基于传统的占星术和数字命理学框架，而非同行评审的科学研究。它旨在提供娱乐和自我反思。许多人发现这些原型有助于理解关系动态，但结果不应被视为确定性预测。",
    faq2Q:"为什么使用三个体系而不仅仅是星座？",faq2A:"单一体系测试只能捕捉配对的一个层面。通过结合西方占星术（性格特征）、中国生肖（生命周期能量）和数字命理学（振动共鸣），测试提供了更全面的评估。每个体系都弥补了其他体系的盲点。",
    faq3Q:"低分是否意味着这段关系注定失败？",faq3A:"绝对不是。较低的分数只是表明可能需要额外理解和努力的领域。许多牢固而持久的关系恰恰依靠对比的能量而蓬勃发展。分数揭示了你们自然节奏不同的地方——意识到这些差异本身就是成长的工具。"
  },

function getZodiac(m,d){
  for(var i=0;i<ZODIAC_SIGNS.length;i++){
    var z=ZODIAC_SIGNS[i];
    if((m===z.start[0]&&d>=z.start[1])||(m===z.end[0]&&d<=z.end[1])) return i;

  }
  return 0;
}

function getAnimal(y){return(y-4)%12;while(arguments[0]<0)arguments[0]+=12;return(y-4)%12}
function lifePathNum(y,m,d){var s=String(y)+String(m)+String(d);var t=0;for(var i=0;i<s.length;i++)t+=parseInt(s[i]);while(t>9&&t!==11&&t!==22)t=Math.floor(t/10)+t%10;return t}

function calculate(){
  var d1=document.getElementById('date1').value;
  var d2=document.getElementById('date2').value;
  if(!d1||!d2)return;

  var p1=d1.split('-'),p2=d2.split('-');
  var y1=+p1[0],m1=+p1[1],day1=+p1[2];
  var y2=+p2[0],m2=+p2[1],day2=+p2[2];

  var z1=getZodiac(m1,day1),z2=getZodiac(m2,day2);
  var a1=(y1-4)%12,a2=(y2-4)%12;
  if(a1<0)a1+=12;if(a2<0)a2+=12;
  var lp1=lifePathNum(y1,m1,day1),lp2=lifePathNum(y2,m2,day2);

  var starScore=ZODIAC_COMPAT[z1%12][z2%12]*20;
  var animalDiff=Math.abs(a1-a2);
  var animalScore=Math.max(0,100-animalDiff*12);
  var numScore=100-Math.abs(lp1-lp2)*8;
  if(numScore<10)numScore=10;

  var total=Math.round(starScore*0.4+animalScore*0.3+numScore*0.3);
  if(total>99)total=99;if(total<1)total=1;

  var tierKey;
  if(total>=90)tierKey='t95';else if(total>=80)tierKey='t85';else if(total>=70)tierKey='t75';
  else if(total>=60)tierKey='t65';else if(total>=50)tierKey='t55';else if(total>=40)tierKey='t45';
  else if(total>=30)tierKey='t35';else if(total>=20)tierKey='t25';else if(total>=10)tierKey='t15';
  else tierKey='t5';

  var t=L[curLang].tiers[tierKey];
  document.getElementById('resScore').textContent=total+'%';
  document.getElementById('resType').textContent=t.type;
  document.getElementById('resMsg').textContent=t.msg;
  document.getElementById('resTip').textContent=L[curLang].tipLabel+' '+t.tip;

  var zn1=ZODIAC_SIGNS[z1].name[curLang]||ZODIAC_SIGNS[z1].name.en;
  var zn2=ZODIAC_SIGNS[z2].name[curLang]||ZODIAC_SIGNS[z2].name.en;
  var an1=ANIMALS[a1][curLang]||ANIMALS[a1].en;
  var an2=ANIMALS[a2][curLang]||ANIMALS[a2].en;

  document.getElementById('zodiacTitle').textContent=L[curLang].zodiacTitle;
  document.getElementById('zStar').textContent=L[curLang].starLabel+' '+ZODIAC_SIGNS[z1].emoji+' '+zn1+' + '+ZODIAC_SIGNS[z2].emoji+' '+zn2;
  document.getElementById('zAnimal').textContent=L[curLang].animalLabel+' '+an1+' + '+an2;
  document.getElementById('zNumero').textContent=L[curLang].numeroLabel+' '+lp1+' + '+lp2;

  var el=document.getElementById('result');
  el.style.display='block';
  el.style.animation='none';el.offsetHeight;el.style.animation='popIn .5s cubic-bezier(.34,1.56,.64,1)';

  var bar=document.querySelector('.gauge-bar');
  bar.style.width='0%';
  setTimeout(function(){bar.style.width=total+'%'},100);
}

function setLang(lang){
  curLang=lang;
  var t=L[lang];
  document.getElementById('t-title').textContent=t.title;
  document.getElementById('t-sub').textContent=t.sub;
  document.getElementById('lbl1').textContent=t.lbl1;
  document.getElementById('lbl2').textContent=t.lbl2;
  document.getElementById('btnCalc').textContent=t.btn;
  document.getElementById('nav-home').textContent=t.nav.home;
  document.getElementById('nav-about').textContent=t.nav.about;
  document.getElementById('nav-contact').textContent=t.nav.contact;
  document.getElementById('nav-privacy').textContent=t.nav.privacy;
  document.getElementById('nav-terms').textContent=t.nav.terms;
  document.querySelectorAll('.tab-text').forEach(function(el){
    var k=el.getAttribute('data-key');
    if(t[k])el.textContent=t[k];
  });
  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.classList.toggle('active',b.getAttribute('data-lang')===lang);
  });
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.getElementById('sec1Title').textContent=t.sec1Title;
  document.getElementById('sec1P1').textContent=t.sec1P1;
  document.getElementById('sec1P2').textContent=t.sec1P2;
  document.getElementById('sec2Title').textContent=t.sec2Title;
  document.getElementById('sec2P1').textContent=t.sec2P1;
  document.getElementById('sec2Sub').textContent=t.sec2Sub;
  var ul=document.getElementById('sec2List');ul.innerHTML='';
  t.sec2List.forEach(function(item){var li=document.createElement('li');li.textContent=item;ul.appendChild(li)});
  document.getElementById('sec3Title').textContent=t.sec3Title;
  document.getElementById('faq1Q').textContent=t.faq1Q;
  document.getElementById('faq1A').textContent=t.faq1A;
  document.getElementById('faq2Q').textContent=t.faq2Q;
  document.getElementById('faq2A').textContent=t.faq2A;
  document.getElementById('faq3Q').textContent=t.faq3Q;
  document.getElementById('faq3A').textContent=t.faq3A;
}

document.getElementById('langBar').addEventListener('click',function(e){
  if(e.target.classList.contains('lang-btn'))setLang(e.target.getAttribute('data-lang'));
});

(function(){

    var n=navigator.language||navigator.userLanguage||'en';

  }catch(e){setLang('en')}
