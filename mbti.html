function buildGrid(containerId,gridNum){
    var el=document.getElementById(containerId);el.innerHTML='';
    TYPES.forEach(function(t){
        var chip=document.createElement('div');
        chip.className='type-chip';
        chip.innerHTML='<span class="emoji">'+EMOJIS[t]+'</span>'+t;
        chip.onclick=function(){
            el.querySelectorAll('.type-chip').forEach(function(c){c.classList.remove('selected')});
            chip.classList.add('selected');
            if(gridNum===1)sel1=t;else sel2=t;
        };
        el.appendChild(chip);
    });
}
buildGrid('grid1',1);buildGrid('grid2',2);

function calculate(){
    if(!sel1||!sel2){alert(i18n[currentLang].alertEmpty);return}
    var key=sel1+'-'+sel2;
    var score=COMPAT[key]||50;
    var t=i18n[currentLang];
    var tier=t.tier(score);

    document.getElementById('resTypes').textContent=EMOJIS[sel1]+' '+sel1+'  ×  '+sel2+' '+EMOJIS[sel2];
    document.getElementById('scoreBig').textContent=score+'%';
    document.getElementById('resMsg').textContent=tier.msg;
    document.getElementById('resDetail').innerHTML='<strong>💪 '+( currentLang==='en'?'Strengths':'강점')+':</strong> '+tier.strength+'<br><br><strong>💡 '+(currentLang==='en'?'Tip':'팁')+':</strong> '+tier.tip;

    var res=document.getElementById('result');res.style.display='none';res.offsetHeight;res.style.display='block';
    var g=document.getElementById('gaugeBar');g.style.width='0%';
    requestAnimationFrame(function(){requestAnimationFrame(function(){g.style.width=Math.max(score,3)+'%'})});
}

function reset(){
    sel1=null;sel2=null;
    document.querySelectorAll('.type-chip').forEach(function(c){c.classList.remove('selected')});
    document.getElementById('result').style.display='none';
    document.getElementById('gaugeBar').style.width='0%';
}

function getShareUrl(){return window.location.href}
function shareTwitter(){window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(getShareText())+'&url='+encodeURIComponent(getShareUrl()),'_blank','width=550,height=420')}

function copyLink(){
    var url=getShareUrl();
    if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){alert(i18n[currentLang].alertCopied)});
    }else{
        var ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.left='-9999px';
        document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
        alert(i18n[currentLang].alertCopied);
    }
}
