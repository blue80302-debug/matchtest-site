var currentLang='ko',sel1=null,sel2=null;

(function(){var c=document.getElementById('floatingBg'),items=['🧠','💜','✨','💫','🩷','⭐','💗','🌟'];for(var i=0;i<18;i++){var s=document.createElement('span');s.textContent=items[i%items.length];s.style.left=(Math.random()*100)+'%';s.style.fontSize=(14+Math.random()*18)+'px';s.style.animationDuration=(10+Math.random()*15)+'s';s.style.animationDelay=(Math.random()*12)+'s';c.appendChild(s)}})();

function buildGrid(containerId,gridNum){
    var el=document.getElementById(containerId);el.innerHTML='';
    TYPES.forEach(function(t){
        var chip=document.createElement('div');
        chip.className='type-chip';
        chip.innerHTML='<span class="emoji">'+EMOJIS[t]+'</span>'+t;
        chip.onclick=function(){
            el.querySelectorAll('.type-chip').forEach(function(c){c.classList.remove('selected')});
            chip.classList.add('selected');
            if(gridNum===1)sel1=t;else sel2=t;
        };
        el.appendChild(chip);
    });
}
buildGrid('grid1',1);buildGrid('grid2',2);

function setLang(lang){
    currentLang=lang;var t=i18n[lang];
    document.getElementById('t-title').textContent=t.title;
    document.getElementById('t-subtitle').textContent=t.subtitle;
    document.getElementById('t-label1').textContent=t.label1;
    document.getElementById('t-label2').textContent=t.label2;
    document.getElementById('t-btn').textContent=t.btn;
    document.getElementById('t-scoreLabel').textContent=t.scoreLabel;
    document.getElementById('t-copyBtn').textContent=t.copyBtn;
    document.getElementById('t-retry').textContent=t.retry;
    document.getElementById('tab-name-text').textContent=t.tabName;
    document.getElementById('tab-mbti-text').textContent=t.tabMbti;
    document.getElementById('nav-home').textContent=t.navHome;
    document.getElementById('nav-about').textContent=t.navAbout;
    document.getElementById('nav-contact').textContent=t.navContact;
    document.getElementById('nav-privacy').textContent=t.navPrivacy;
    document.getElementById('nav-terms').textContent=t.navTerms;
    document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active',b.dataset.lang===lang)});
    document.getElementById('articleAbout').innerHTML='<h2>'+t.articleTitle+'</h2>'+t.articleBody;
}
setLang('ko');

document.getElementById('langBar').addEventListener('click',function(e){if(e.target.classList.contains('lang-btn'))setLang(e.target.dataset.lang)});

function calculate(){
    if(!sel1||!sel2){alert(i18n[currentLang].alertEmpty);return}
    var key=sel1+'-'+sel2;
    var score=COMPAT[key]||50;
    var t=i18n[currentLang];
    var tier=t.tier(score);

    document.getElementById('resTypes').textContent=EMOJIS[sel1]+' '+sel1+'  ×  '+sel2+' '+EMOJIS[sel2];
    document.getElementById('scoreBig').textContent=score+'%';
    document.getElementById('resMsg').textContent=tier.msg;
    document.getElementById('resDetail').innerHTML='<strong>💪 '+( currentLang==='en'?'Strengths':'강점')+':</strong> '+tier.strength+'<br><br><strong>💡 '+(currentLang==='en'?'Tip':'팁')+':</strong> '+tier.tip;

    var res=document.getElementById('result');res.style.display='none';res.offsetHeight;res.style.display='block';
    var g=document.getElementById('gaugeBar');g.style.width='0%';
    requestAnimationFrame(function(){requestAnimationFrame(function(){g.style.width=Math.max(score,3)+'%'})});
}

function reset(){
    sel1=null;sel2=null;
    document.querySelectorAll('.type-chip').forEach(function(c){c.classList.remove('selected')});
    document.getElementById('result').style.display='none';
    document.getElementById('gaugeBar').style.width='0%';
}

function getShareText(){return i18n[currentLang].shareText(sel1,sel2,COMPAT[sel1+'-'+sel2]||50)}
function getShareUrl(){return window.location.href}
function shareTwitter(){window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(getShareText())+'&url='+encodeURIComponent(getShareUrl()),'_blank','width=550,height=420')}
function shareFacebook(){window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(getShareUrl())+'&quote='+encodeURIComponent(getShareText()),'_blank','width=550,height=420')}
function copyLink(){
    var url=getShareUrl();
    if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){alert(i18n[currentLang].alertCopied)});
    }else{
        var ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.left='-9999px';
        document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
        alert(i18n[currentLang].alertCopied);
    }
}
