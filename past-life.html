var curLang='en';

function hash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return Math.abs(h)}

function reveal(){
  var name=document.getElementById('inpName').value.trim();
  var bday=document.getElementById('inpBday').value;
  if(!name||!bday)return;

  var seed=hash(name+bday);
  var jobIdx=seed%JOBS.length;
  var countryIdx=(seed>>4)%COUNTRIES.length;
  var eraIdx=(seed>>8)%ERAS.length;
  var persIdx=(seed>>12)%PERSONALITIES[curLang].length;

  var job=JOBS[jobIdx];
  var country=COUNTRIES[countryIdx];
  var era=ERAS[eraIdx];

  document.getElementById('resEra').textContent=(L[curLang].eraLabel||'Era')+': '+(era[curLang]||era.en);
  document.getElementById('resJob').textContent=job.emoji+' '+(job[curLang]||job.en);
  document.getElementById('resCountry').textContent=(country.emoji)+' '+(country[curLang]||country.en);
  document.getElementById('resPersonality').textContent=PERSONALITIES[curLang][persIdx]||PERSONALITIES.en[persIdx];

  document.getElementById('traitTitle').textContent=L[curLang].traitTitle;
  document.getElementById('trCourage').textContent=L[curLang].trCourage;
  document.getElementById('trWisdom').textContent=L[curLang].trWisdom;
  document.getElementById('trCharisma').textContent=L[curLang].trCharisma;
  document.getElementById('trCreativity').textContent=L[curLang].trCreativity;
  document.getElementById('trKindness').textContent=L[curLang].trKindness;

  var traits=[30+(seed%71),30+((seed>>3)%71),30+((seed>>6)%71),30+((seed>>9)%71),30+((seed>>12)%71)];
  var bars=['barCourage','barWisdom','barCharisma','barCreativity','barKindness'];
  setTimeout(function(){
    for(var i=0;i<bars.length;i++){
      document.getElementById(bars[i]).style.width=traits[i]+'%';
    }
  },100);

  var el=document.getElementById('result');
  el.style.display='block';
  el.style.animation='none';el.offsetHeight;el.style.animation='popIn .5s cubic-bezier(.34,1.56,.64,1)';
}

function setLang(lang){
  curLang=lang;
  var t=L[lang];
  document.getElementById('t-title').textContent=t.title;
  document.getElementById('t-sub').textContent=t.sub;
  document.getElementById('lbl-name').textContent=t.lblName;
  document.getElementById('lbl-bday').textContent=t.lblBday;
  document.getElementById('btnReveal').textContent=t.btn;
  document.getElementById('inpName').placeholder=t.ph;
  document.getElementById('nav-home').textContent=t.nav.home;
  document.getElementById('nav-about').textContent=t.nav.about;
  document.getElementById('nav-contact').textContent=t.nav.contact;
  document.getElementById('nav-privacy').textContent=t.nav.privacy;
  document.getElementById('nav-terms').textContent=t.nav.terms;
  document.querySelectorAll('.tab-text').forEach(function(el){
    var k=el.getAttribute('data-key');
    if(t[k])el.textContent=t[k];
  });
  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.classList.toggle('active',b.getAttribute('data-lang')===lang);
  });
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
}

document.getElementById('langBar').addEventListener('click',function(e){
  if(e.target.classList.contains('lang-btn'))setLang(e.target.getAttribute('data-lang'));
});
