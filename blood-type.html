(function(){var c=document.getElementById('floatingBg'),items=['🩸','❤','💜','✨','💗','🩷','💫','🤍'];for(var i=0;i<18;i++){var s=document.createElement('span');s.textContent=items[i%items.length];s.style.left=(Math.random()*100)+'%';s.style.fontSize=(14+Math.random()*18)+'px';s.style.animationDuration=(10+Math.random()*15)+'s';s.style.animationDelay=(Math.random()*12)+'s';c.appendChild(s)}})();

document.querySelectorAll('#sel1 .blood-btn').forEach(function(b){

document.querySelectorAll('#sel2 .blood-btn').forEach(function(b){

function setLang(lang){
    currentLang=lang;var t=i18n[lang];
    document.getElementById('t-title').textContent=t.title;
    document.getElementById('t-sub').textContent=t.sub;
    document.getElementById('lbl1').textContent=t.lbl1;
    document.getElementById('lbl2').textContent=t.lbl2;
    document.getElementById('btnCalc').textContent=t.btn;
    document.getElementById('t-scoreLabel').textContent=t.scoreLabel;
    document.getElementById('t-copyBtn').innerHTML=t.copyBtn;
    document.getElementById('t-retry').textContent=t.retry;
    document.getElementById('lblStrength').textContent=t.lblStrength;
    document.getElementById('lblCaution').textContent=t.lblCaution;
    document.getElementById('lblTip').textContent=t.lblTip;
    document.getElementById('nav-home').textContent=t.navHome;
    document.getElementById('nav-about').textContent=t.navAbout;
    document.getElementById('nav-contact').textContent=t.navContact;
    document.getElementById('nav-privacy').textContent=t.navPrivacy;
    document.getElementById('nav-terms').textContent=t.navTerms;
    document.getElementById('f-about').textContent=t.navAbout;
    document.getElementById('f-contact').textContent=t.navContact;
    document.getElementById('f-privacy').textContent=t.navPrivacy;
    document.getElementById('f-terms').textContent=t.navTerms;
    document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active',b.dataset.lang===lang)});
    document.querySelectorAll('.tab-text').forEach(function(el){var k=el.dataset.key;if(t[k])el.textContent=t[k]});
    if(t.articleTheory){
        document.getElementById('articleTheory').innerHTML='<h2>'+t.articleTheory.title+'</h2>'+t.articleTheory.body;
        document.getElementById('articleCulture').innerHTML='<h2>'+t.articleCulture.title+'</h2>'+t.articleCulture.body;
        document.getElementById('articleScience').innerHTML='<h2>'+t.articleScience.title+'</h2>'+t.articleScience.body;
    }
}

document.getElementById('langBar').addEventListener('click',function(e){if(e.target.classList.contains('lang-btn'))setLang(e.target.dataset.lang)});

(function detectLang(){
    var bl=(navigator.language||'ko').substring(0,2).toLowerCase();
    if(bl==='ko')setLang('ko');else setLang('en');
})();

function calculate(){
    var t=i18n[currentLang];
    if(!my1||!my2){alert(t.alertSelect);return}
    var key=my1+'-'+my2;
    var data=compat[key];
    if(!data)return;
    lastScore=data.score;
    var r=data[currentLang];
    document.getElementById('resNames').textContent=my1+' ♥ '+my2;
    document.getElementById('scoreBig').textContent=lastScore+'%';
    document.getElementById('resType').textContent=r.type;
    document.getElementById('resMsg').textContent=r.msg;
    document.getElementById('resStrength').textContent=r.strength;
    document.getElementById('resCaution').textContent=r.caution;
    document.getElementById('resTip').textContent=r.tip;
    var res=document.getElementById('result');res.style.display='none';res.offsetHeight;res.style.display='block';
    var g=document.getElementById('gaugeBar');g.style.width='0%';
    requestAnimationFrame(function(){requestAnimationFrame(function(){g.style.width=Math.max(lastScore,3)+'%'})});
}

function resetTest(){
    my1=null;my2=null;
    document.querySelectorAll('.blood-btn').forEach(function(b){b.classList.remove('selected')});
    document.getElementById('result').style.display='none';
    document.getElementById('gaugeBar').style.width='0%';
}

function getShareText(){return i18n[currentLang].shareText(my1,my2,lastScore)}
function getShareUrl(){return window.location.href}
function shareTwitter(){window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(getShareText())+'&url='+encodeURIComponent(getShareUrl()),'_blank','width=550,height=420')}
function shareFacebook(){window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(getShareUrl())+'&quote='+encodeURIComponent(getShareText()),'_blank','width=550,height=420')}
function shareWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(getShareText()+' '+getShareUrl()),'_blank')}
function shareLine(){window.open('https://social-plugins.line.me/lineit/share?url='+encodeURIComponent(getShareUrl())+'&text='+encodeURIComponent(getShareText()),'_blank')}
function shareKakao(){copyLink()}
function copyLink(){
    var url=getShareUrl();
    if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){alert(i18n[currentLang].alertCopied)});
    }else{
        var ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.left='-9999px';
        document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
        alert(i18n[currentLang].alertCopied);
    }
}
</script>
